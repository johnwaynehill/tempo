<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Tempo App Icon Editable</title>
  <desc>Figma-friendly editable SVG matching the current Tempo icon design.</desc>

  <defs>
    <linearGradient id="tempo-bg" x1="52" y1="36" x2="470" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BAAA2" />
      <stop offset="1" stop-color="#465A53" />
    </linearGradient>
  </defs>

  <g id="background">
    <rect id="base" x="0" y="0" width="512" height="512" rx="136" fill="url(#tempo-bg)" />
  </g>

  <g id="monogram" fill="#F4F1EC">
    <rect id="top-bar" x="88" y="96" width="320" height="112" rx="42" />
    <rect id="stem" x="200" y="96" width="112" height="328" rx="56" />
    <circle id="period" cx="392" cy="360" r="52" />
  </g>
</svg>
