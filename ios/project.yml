name: Tempo

options:
  bundleIdPrefix: com.johnwaynehill
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TempoKit:
    path: TempoKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # The team picked in Xcode (Tempo target > Signing & Capabilities); kept here so
    # `xcodegen generate` doesn't drop it.
    DEVELOPMENT_TEAM: AMA7J4DZRB

targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Tempo
      # Live Activity attributes + the few colours the widget needs; also in TempoWidgets.
      - path: Shared
      # App Intents: Shortcuts actions, App Shortcut phrases, widget buttons; also in TempoWidgets.
      - path: Intents
    dependencies:
      - package: TempoKit
      - target: TempoWidgets
      - target: TempoShare
    entitlements:
      path: Tempo/Tempo.entitlements
      properties:
        # One team-wide keychain group so extensions can read the API key.
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.johnwaynehill.Tempo.shared"
        # Shared container: offline cache, extension inbox, timer state for the widget.
        com.apple.security.application-groups:
          - group.com.johnwaynehill.Tempo
        # Mood check-ins are saved to Apple Health as State of Mind (write only).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Tempo/Info.plist
      properties:
        TempoKeychainAccessGroup: "$(AppIdentifierPrefix)com.johnwaynehill.Tempo.shared"
        NSHealthUpdateUsageDescription: Tempo saves your mood check-ins to Apple Health as State of Mind.
        CFBundleDisplayName: Tempo
        CFBundleName: Tempo
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Bundled variable fonts (SIL OFL; licences alongside them in Tempo/Fonts).
        UIAppFonts:
          - "Manrope[wght].ttf"
          - "Inter[opsz,wght].ttf"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # Lets TEMPO_API_URL point at http://localhost:3001 for local testing.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnwaynehill.Tempo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Widget extension: the timer's Live Activity and the Home Screen widgets.
  TempoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TempoWidgets
      - path: Shared
      - path: Intents
    dependencies:
      - package: TempoKit
    entitlements:
      path: TempoWidgets/TempoWidgets.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.johnwaynehill.Tempo.shared"
        # Shared container: offline cache, extension inbox, timer state for the widget.
        com.apple.security.application-groups:
          - group.com.johnwaynehill.Tempo
    info:
      path: TempoWidgets/Info.plist
      properties:
        TempoKeychainAccessGroup: "$(AppIdentifierPrefix)com.johnwaynehill.Tempo.shared"
        CFBundleDisplayName: Tempo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnwaynehill.Tempo.TempoWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES

  # Share extension: text or a link from any app becomes an Inbox todo.
  TempoShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TempoShare
      - path: Shared
    dependencies:
      - package: TempoKit
    entitlements:
      path: TempoShare/TempoShare.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.johnwaynehill.Tempo.shared"
        # Shared container: offline cache, extension inbox, timer state for the widget.
        com.apple.security.application-groups:
          - group.com.johnwaynehill.Tempo
    info:
      path: TempoShare/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        TempoKeychainAccessGroup: "$(AppIdentifierPrefix)com.johnwaynehill.Tempo.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnwaynehill.Tempo.TempoShare
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES

schemes:
  Tempo:
    build:
      targets:
        Tempo: all
    run:
      config: Debug
      environmentVariables:
        # Flip this on (Edit Scheme > Run > Arguments) to point the app at a local API.
        - variable: TEMPO_API_URL
          value: http://localhost:3001
          isEnabled: false
    archive:
      config: Release
