name: Tempo

options:
  bundleIdPrefix: com.johnwaynehill
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TempoKit:
    path: TempoKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # The team picked in Xcode (Tempo target > Signing & Capabilities); kept here so
    # `xcodegen generate` doesn't drop it.
    DEVELOPMENT_TEAM: AMA7J4DZRB

targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Tempo
      # Live Activity attributes + the few colours the widget needs; also in TempoWidgets.
      - path: Shared
    dependencies:
      - package: TempoKit
      - target: TempoWidgets
    info:
      path: Tempo/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        CFBundleName: Tempo
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Bundled variable fonts (SIL OFL; licences alongside them in Tempo/Fonts).
        UIAppFonts:
          - "Manrope[wght].ttf"
          - "Inter[opsz,wght].ttf"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # Lets TEMPO_API_URL point at http://localhost:3001 for local testing.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnwaynehill.Tempo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Widget extension: hosts the timer's Live Activity (Home Screen widgets come in Phase 3).
  TempoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TempoWidgets
      - path: Shared
    info:
      path: TempoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnwaynehill.Tempo.TempoWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES

schemes:
  Tempo:
    build:
      targets:
        Tempo: all
    run:
      config: Debug
      environmentVariables:
        # Flip this on (Edit Scheme > Run > Arguments) to point the app at a local API.
        - variable: TEMPO_API_URL
          value: http://localhost:3001
          isEnabled: false
    archive:
      config: Release
